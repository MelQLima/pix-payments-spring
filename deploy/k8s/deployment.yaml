apiVersion: apps/v1
kind: Deployment
metadata:
  name: pix-pagamentos
  labels: { app: pix-pagamentos }
spec:
  replicas: 2
  selector:
    matchLabels: { app: pix-pagamentos }
  template:
    metadata:
      labels: { app: pix-pagamentos }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api
          image: ghcr.io/melqlima/pix-pagamentos-spring:latest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: KAFKA_BROKERS
              value: kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: pix-pagamentos, key: database-url } }
            - name: DATABASE_USER
              valueFrom: { secretKeyRef: { name: pix-pagamentos, key: database-user } }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: pix-pagamentos, key: database-password } }
            - name: PIX_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: pix-pagamentos, key: webhook-secret } }
            - name: PIX_PSP_MODE
              value: http
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pix-pagamentos
spec:
  selector: { app: pix-pagamentos }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pix-pagamentos
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pix-pagamentos }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
