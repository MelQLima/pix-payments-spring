spring:
  application:
    name: pix-pagamentos
  threads:
    virtual:
      enabled: true # Java 21 virtual threads for request handling
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pix}
    username: ${DATABASE_USER:pix}
    password: ${DATABASE_PASSWORD:pix}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  mvc:
    problemdetails:
      enabled: true

pix:
  merchant-account: ${PIX_MERCHANT_ACCOUNT:merchant-1}
  webhook-secret: ${PIX_WEBHOOK_SECRET:local-dev-secret}
  events-topic: ${PIX_EVENTS_TOPIC:payments.events}
  outbox-batch-size: 100
  outbox-poll-interval: 1s
  default-expiry: 1h
  psp:
    mode: ${PIX_PSP_MODE:fake} # fake | http
    base-url: ${PIX_PSP_BASE_URL:http://localhost:9999}

resilience4j:
  circuitbreaker:
    instances:
      psp:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      psp:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  swagger-ui:
    path: /docs
